<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Rainbow Spectrum Ring (PicSay Effects & Filters) -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="80%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Camera Body Gradient -->
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <radialGradient id="lensGlass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Magic Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#475569" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Outer Ambient Creative Circle -->
  <circle cx="256" cy="260" r="190" fill="none" stroke="url(#rainbowGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85" filter="url(#glow)"/>

  <!-- Camera Body -->
  <g filter="url(#shadow)">
    <!-- Top Flash / Viewfinder bump -->
    <path d="M 196 150 L 220 120 L 292 120 L 316 150 Z" fill="#334155" stroke="#475569" stroke-width="4"/>
    <circle cx="236" cy="136" r="6" fill="#38bdf8"/>
    <rect x="264" y="131" width="28" height="10" rx="4" fill="#fbbf24"/>

    <!-- Main Camera Chassis -->
    <rect x="96" y="150" width="320" height="230" rx="36" fill="url(#cameraGrad)" stroke="#475569" stroke-width="6"/>

    <!-- Grip Texture Bar -->
    <rect x="116" y="174" width="22" height="182" rx="10" fill="#0f172a" opacity="0.6"/>
    <line x1="127" y1="190" x2="127" y2="340" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 12"/>

    <!-- Shutter Button -->
    <rect x="120" y="136" width="36" height="14" rx="4" fill="#ef4444"/>

    <!-- Large Central Lens Barrel -->
    <circle cx="266" cy="265" r="92" fill="#090d16" stroke="#475569" stroke-width="8"/>
    <circle cx="266" cy="265" r="82" fill="none" stroke="url(#rainbowGrad)" stroke-width="8"/>

    <!-- Glass Lens Element with Reflection -->
    <circle cx="266" cy="265" r="70" fill="url(#lensGlass)"/>

    <!-- Lens Aperture Reflections -->
    <ellipse cx="242" cy="242" rx="36" ry="20" transform="rotate(-30 242 242)" fill="#ffffff" opacity="0.28"/>
    <circle cx="288" cy="288" r="10" fill="#38bdf8" opacity="0.6"/>

    <!-- Shutter Iris Core -->
    <circle cx="266" cy="265" r="28" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="266" cy="265" r="10" fill="#60a5fa"/>
  </g>

  <!-- Big Magic Sparkle Star (Top Right - Editor Magic) -->
  <g transform="translate(370, 92)" filter="url(#glow)">
    <path d="M 32 0 Q 32 32 64 32 Q 32 32 32 64 Q 32 32 0 32 Q 32 32 32 0 Z" fill="url(#sparkleGrad)"/>
    <circle cx="32" cy="32" r="8" fill="#ffffff"/>
  </g>

  <!-- Secondary Sparkle (Bottom Left) -->
  <g transform="translate(74, 370) scale(0.6)" filter="url(#glow)">
    <path d="M 32 0 Q 32 32 64 32 Q 32 32 0 32 Q 32 32 32 0 Z" fill="#38bdf8"/>
    <circle cx="32" cy="32" r="6" fill="#ffffff"/>
  </g>

  <!-- Framing Crop Marks (Corner Accents) -->
  <path d="M 70 120 L 70 80 L 110 80" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M 442 392 L 442 432 L 402 432" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
</svg>
