    <meta property="og:description" content="تطبيق متكامل لتعديل وتصميم الصور والفيديوهات يعمل بدون إنترنت بالكامل مع دعم متعدد اللغات وأدوات احترافية." />

    <script>
      (function() {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function isViteHmr(url, protocols) {
            if (protocols === 'vite-hmr') return true;
            if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) return true;
            if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1)) return true;
            return false;
          }

          class FakeHmrSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = String(url || '');
              this.protocol = 'vite-hmr';
              this.readyState = 1; // OPEN: prevents 'closed without opened' rejection
              this.bufferedAmount = 0;
              this.extensions = '';
              this.binaryType = 'blob';
              this.onopen = null;
              this.onmessage = null;
              this.onerror = null;
              this.onclose = null;
            }
            send() {}
            close() {
              this.readyState = 3;
            }
          }

          FakeHmrSocket.CONNECTING = 0;
          FakeHmrSocket.OPEN = 1;
          FakeHmrSocket.CLOSING = 2;
          FakeHmrSocket.CLOSED = 3;

          var WebSocketProxy = new Proxy(NativeWebSocket, {
            construct(target, args) {
              var url = args[0];
              var protocols = args[1];
              if (isViteHmr(url, protocols)) {
                return new FakeHmrSocket(url, protocols);
              }
              return Reflect.construct(target, args);
            }
          });

          WebSocketProxy.CONNECTING = 0;
          WebSocketProxy.OPEN = 1;
          WebSocketProxy.CLOSING = 2;
          WebSocketProxy.CLOSED = 3;

          window.WebSocket = WebSocketProxy;
        }

        // Suppress benign Vite HMR WebSocket disconnect noise in sandboxed preview iframe
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var item = arguments[i];
            var text = item instanceof Error ? (item.message + ' ' + (item.stack || '')) : String(item || '');
            if (text.includes('WebSocket') || text.includes('closed without opened') || text.includes('@vite/client')) {
              return;
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message)) || '';
          if (msg.includes('WebSocket') || msg.includes('closed without opened') || msg.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? String(e.reason.message || e.reason.stack || e.reason) : '';
          if (reason.includes('WebSocket') || reason.includes('closed without opened') || reason.includes('@vite/client')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

          <span>جاري تشغيل محرر الصور والمؤثرات...</span>
